<body>

    <main class="mb-5 container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form>
                    <section class="mb-5">
                        <h5 class="text-uppercase fw-bold text-secondary mb-4" style="font-size:0.9rem;">Gửi hồ sơ ứng tuyển</h5>
                        <div class="row align-items-center mb-3">
                            <label class="col-sm-4 col-form-label">Model OCR</label>
                            <div class="col-sm-8">
                                <select id="modelSelect" class="form-select">
                                    <option value="tesseract">Tesseract (Mặc định)</option>
                                    <option value="vintern">Vintern-1B (vLLM)</option>
                                </select>
                            </div>
                        </div>
                        <div class="row align-items-center mb-4"><label class="col-sm-4 col-form-label">Hồ sơ/CV <span class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <label class="text-uppercase fw-bold text-secondary border px-3 py-2 btn btn-light mb-0" style="font-size:0.75rem;background-color:#f1f3f5; cursor: pointer;">
                                    <svg class="bi bi-paperclip me-1" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" style="font-size: 20px;">
                                        <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0z"></path>
                                    </svg> Đính kèm Hồ sơ/CV <input id="fileUpload" type="file" hidden="" required="" accept=".pdf, .docx, .jpg, .jpeg, .png">
                                </label>
                                <div id="loadingIndicator" class="d-none mt-2 text-primary fw-medium" style="font-size: 0.85rem;">
                                    <div class="spinner-border spinner-border-sm me-2" role="status"></div><span id="loadingText">Đang phân tích CV...</span>
                                </div>
                                <div id="successMessage" class="d-none mt-2 text-success fw-medium" style="font-size: 0.85rem;">
                                    <i class="bi bi-check-circle me-1"></i><span id="successText"></span>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3"><label class="col-sm-4 col-form-label">Họ và tên <span class="text-danger">*</span></label>
                            <div class="col-sm-8"><input id="inputName" class="form-control" type="text" required=""></div>
                        </div>
                        <div class="row mb-3"><label class="col-sm-4 col-form-label">Email <span class="text-danger">*</span></label>
                            <div class="col-sm-8"><input id="inputEmail" class="form-control" type="email" required=""></div>
                        </div>
                        <div class="row mb-3"><label class="col-sm-4 col-form-label">Số điện thoại <span class="text-danger">*</span></label>
                            <div class="col-sm-8"><input id="inputPhone" class="form-control" type="tel" required=""></div>
                        </div>
                        <div class="row mb-3"><label class="col-sm-4 col-form-label">Địa chỉ hiện tại <span class="text-danger">*</span></label>
                            <div class="col-sm-8"><input id="inputAddress" class="form-control" type="text" required=""></div>
                        </div>
                        <div class="row mb-3"><label class="col-sm-4 col-form-label">Công ty hiện tại <span class="text-danger">*</span></label>
                            <div class="col-sm-8"><input id="inputCompany" class="form-control" type="text" required=""></div>
                        </div>
                    </section>
                    <section class="mb-4">
                        <h5 class="text-uppercase fw-bold text-secondary mb-4" style="font-size:0.9rem;">Liên kết</h5>
                        <div class="row mb-3"><label class="col-sm-4 col-form-label">LinkedIn URL</label>
                            <div class="col-sm-8"><input id="inputLinkedin" class="form-control" type="url"></div>
                        </div>
                        <div class="row mb-3"><label class="col-sm-4 col-form-label">Twitter URL</label>
                            <div class="col-sm-8"><input id="inputTwitter" class="form-control" type="url"></div>
                        </div>
                        <section class="mb-4">
                            <div class="row mb-3"><label class="col-sm-4 col-form-label">Gmail</label>
                                <div class="col-sm-8"><input id="inputGmail" class="form-control" type="url"></div>
                            </div>
                            <div class="row mb-3"><label class="col-sm-4 col-form-label">Github/Portfolio URL</label>
                                <div class="col-sm-8"><input id="inputGithub" class="form-control" type="url"></div>
                            </div>
                        </section>
                    </section>
                    <div class="text-end"><button class="btn btn-primary px-4 py-2" type="submit">Gửi ứng tuyển</button></div>
                </form>
                
                <!-- Raw Output Section -->
                <div id="rawOutputSection" class="mt-5 d-none">
                    <h5 class="text-uppercase fw-bold text-secondary mb-3" style="font-size:0.9rem;">Kết quả trả về thô (Raw Output)</h5>
                    <div class="card bg-light border-0">
                        <div class="card-body p-3">
                            <pre id="rawOutputContent" class="mb-0" style="white-space: pre-wrap; word-wrap: break-word; font-size: 0.85rem; color: #333; font-family: monospace;"></pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <!-- Libraries for text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script>
        // Setup PDF.js worker
        if (window['pdfjs-dist/build/pdf']) {
            window['pdfjs-dist/build/pdf'].GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        const fileUpload = document.getElementById('fileUpload');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const loadingText = document.getElementById('loadingText');
        const successMessage = document.getElementById('successMessage');
        const successText = document.getElementById('successText');

        let currentSchema = [];
        
        async function loadSchema() {
            try {
                const response = await fetch('/json/schema.json');
                if (response.ok) {
                    currentSchema = await response.json();
                } else {
                    console.warn("Không tìm thấy schema, vui lòng tạo bên trang Trích xuất");
                }
            } catch (e) {
                console.error("Lỗi tải schema:", e);
            }
        }
        
        window.addEventListener('DOMContentLoaded', loadSchema);

        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const selectedModel = document.getElementById('modelSelect').value;

            // Hide raw output on new upload
            document.getElementById('rawOutputSection').classList.add('d-none');
            document.getElementById('rawOutputContent').textContent = '';

            // Show loading
            loadingIndicator.classList.remove('d-none');
            if (successMessage) successMessage.classList.add('d-none');
            const fileExt = file.name.split('.').pop().toLowerCase();
            
            const startTime = performance.now();

            try {
                if (selectedModel === 'vintern') {
                    loadingText.innerText = "Đang gửi ảnh tới Vintern-1B... (Có thể mất vài giây)";
                    let base64Image = '';
                    if (fileExt === 'pdf') {
                        base64Image = await convertPdfToImageBase64(file);
                    } else if (['jpg', 'jpeg', 'png'].includes(fileExt)) {
                        base64Image = await convertImageToBase64(file);
                    } else {
                        alert('Vintern-1B chỉ hỗ trợ PDF và Ảnh.');
                        loadingIndicator.classList.add('d-none');
                        return;
                    }
                    
                    const extractedJson = await extractWithVintern(base64Image);
                    fillFormWithJson(extractedJson);
                    
                } else {
                    // Tesseract or text-based extraction
                    let rawText = '';
                    if (fileExt === 'pdf') {
                        loadingText.innerText = "Đang đọc file PDF...";
                        rawText = await extractTextFromPDF(file);
                    } else if (fileExt === 'docx') {
                        loadingText.innerText = "Đang đọc file DOCX...";
                        rawText = await extractTextFromDOCX(file);
                    } else if (['jpg', 'jpeg', 'png'].includes(fileExt)) {
                        loadingText.innerText = "Đang quét ảnh (OCR)... (Có thể mất 2-5 giây)";
                        rawText = await extractTextFromImage(file);
                    } else {
                        alert('Vui lòng chọn file định dạng PDF, DOCX hoặc Ảnh.');
                        loadingIndicator.classList.add('d-none');
                        return;
                    }

                    console.log("Extracted Text:", rawText);
                    document.getElementById('rawOutputSection').classList.remove('d-none');
                    document.getElementById('rawOutputContent').textContent = rawText;
                    
                    fillFormWithExtractedData(rawText);
                }

                const endTime = performance.now();
                const timeTaken = ((endTime - startTime) / 1000).toFixed(2);
                console.log(`Thời gian trích xuất: ${timeTaken} giây`);
                if (successMessage) {
                    successMessage.classList.remove('d-none');
                    successText.innerText = `Trích xuất hoàn tất trong ${timeTaken} giây.`;
                }

            } catch (error) {
                console.error("Lỗi khi xử lý file:", error);
                alert("Có lỗi xảy ra khi đọc file. Vui lòng kiểm tra lại (hoặc kiểm tra vLLM server).");
            } finally {
                loadingIndicator.classList.add('d-none');
                fileUpload.value = ''; // reset file input so same file can trigger change again if needed
            }
        });

        async function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function convertPdfToImageBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await window['pdfjs-dist/build/pdf'].getDocument(typedarray).promise;
                        const page = await pdf.getPage(1); // Get first page
                        const viewport = page.getViewport({ scale: 1.5 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function extractWithVintern(base64DataUrl) {
            // Chuyển về dạng chuỗi không có dấu xuống dòng, tương tự json.dumps() mặc định của Python
            const schemaStr = JSON.stringify(currentSchema);
            
            const prompt = `Trích xuất các dữ liệu trong ảnh. trả về dạng json theo mẫu:\n${schemaStr}`;
            
            const response = await fetch('http://localhost:8000/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "5CD-AI/Vintern-1B-v3_5",
                    messages: [
                        {
                            role: "user",
                            content: [
                                { type: "text", text: prompt },
                                { type: "image_url", image_url: { url: base64DataUrl } }
                            ]
                        }
                    ],
                    temperature: 0.1,
                    max_tokens: 1500
                })
            });
            
            if (!response.ok) {
                throw new Error("Lỗi gọi vLLM API");
            }
            const data = await response.json();
            const textContent = data.choices[0].message.content;
            
            // Display raw output
            document.getElementById('rawOutputSection').classList.remove('d-none');
            document.getElementById('rawOutputContent').textContent = textContent;
            
            // Clean markdown json format if model outputs it
            let cleaned = textContent.replace(/```json/gi, '').replace(/```/g, '').trim();
            
            // Tìm điểm bắt đầu của JSON (dấu [ hoặc { đầu tiên)
            let startIndex = cleaned.search(/\[|\{/);
            if (startIndex !== -1) {
                cleaned = cleaned.substring(startIndex);
            }
            
            // Xử lý lỗi model dính liền 2 array (VD: ][ hoặc } {)
            let splitIdx = cleaned.indexOf('][');
            if (splitIdx !== -1) cleaned = cleaned.substring(0, splitIdx + 1);
            else {
                splitIdx = cleaned.indexOf('}\n[');
                if (splitIdx !== -1) cleaned = cleaned.substring(0, splitIdx + 1);
            }
            
            // Cắt phần đuôi nếu model chat thêm rác (tìm dấu ] hoặc } cuối cùng)
            let endIndex = Math.max(cleaned.lastIndexOf(']'), cleaned.lastIndexOf('}'));
            if (endIndex !== -1) {
                cleaned = cleaned.substring(0, endIndex + 1);
            }

            let parsed = null;
            try {
                parsed = JSON.parse(cleaned);
            } catch (e) {
                console.error("Vẫn không thể parse JSON:", e, textContent);
                throw new Error("Phản hồi của AI không đúng định dạng JSON.");
            }
            return parsed;
        }

        function fillFormWithJson(jsonObj) {
            // Nếu trả về một mảng chứa 1 object, lấy object đó
            if (Array.isArray(jsonObj)) {
                if (jsonObj.length > 0) jsonObj = jsonObj[0];
                else return;
            }
            
            for (const key in jsonObj) {
                let input = document.getElementById(key);
                
                // Nếu model tự chế ra key (vd: input_address, input Github), ta thử tìm tương đương
                if (!input) {
                    const normalizedKey = key.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    const allInputs = document.querySelectorAll('input');
                    for (let i = 0; i < allInputs.length; i++) {
                        if (allInputs[i].id.toLowerCase() === normalizedKey) {
                            input = allInputs[i];
                            break;
                        }
                    }
                }
                
                if (input) {
                    input.value = jsonObj[key];
                }
            }
        }

        async function extractTextFromPDF(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await window['pdfjs-dist/build/pdf'].getDocument(typedarray).promise;
                        let text = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            text += textContent.items.map(item => item.str).join(' ') + '\n';
                        }
                        resolve(text);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function extractTextFromDOCX(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    mammoth.extractRawText({arrayBuffer: arrayBuffer})
                        .then(function(result){
                            resolve(result.value);
                        })
                        .catch(reject);
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function extractTextFromImage(file) {
            const result = await Tesseract.recognize(file, 'vie+eng', {
                logger: m => console.log(m)
            });
            return result.data.text;
        }

        function fillFormWithExtractedData(text) {
            // 1. Email
            const emailRegex = /([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/;
            const emailMatch = text.match(emailRegex);
            if (emailMatch && document.getElementById('inputEmail')) {
                document.getElementById('inputEmail').value = emailMatch[0];
            }

            // 2. Phone
            // Regex cho số điện thoại kiểu Việt Nam (+84, 09, 03...)
            const phoneRegex = /(?:(?:\+?84|0)(?:\s|\.)?)?[35789]\d{1}(?:\s|\.)?\d{3}(?:\s|\.)?\d{4}\b/;
            const phoneMatch = text.match(phoneRegex);
            if (phoneMatch && document.getElementById('inputPhone')) {
                const cleanedPhone = phoneMatch[0].replace(/[\s\.]/g, ''); // Xóa khoảng trắng/dấu chấm
                document.getElementById('inputPhone').value = cleanedPhone;
            }

            // 3. LinkedIn
            const linkedinRegex = /(?:https?:\/\/)?(?:www\.)?linkedin\.com\/in\/[a-zA-Z0-9_-]+/;
            const linkedinMatch = text.match(linkedinRegex);
            if (linkedinMatch && document.getElementById('inputLinkedin')) {
                let url = linkedinMatch[0];
                if (!url.startsWith('http')) url = 'https://' + url;
                document.getElementById('inputLinkedin').value = url;
            }

            // 4. Tên (Heuristic: lấy dòng đầu tiên hoặc thứ 2 trông có vẻ giống Tên)
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 3 && l.split(' ').length >= 2 && l.split(' ').length <= 5);
            if (lines.length > 0 && document.getElementById('inputName')) {
                const nameCandidate = lines.find(l => !/curriculum|vitae|resume|sơ yếu|lý lịch/i.test(l));
                if (nameCandidate && !document.getElementById('inputName').value) {
                    // Chữ cái đầu mỗi từ viết hoa (cho đẹp)
                    const formattedName = nameCandidate.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
                    document.getElementById('inputName').value = formattedName;
                }
            }
        }
    </script>
